name: Deploy LLM Gateway to Azure App Service

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: llm-gateway-1756826876
  AZURE_RESOURCE_GROUP: llm-gateway-rg

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        lfs: true
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r api/requirements_api.txt
        
    - name: Create deployment package
      run: |
        # Verify Git LFS model download - ALL required files
        echo "📊 Verifying DistilBERT model and all required files..."
        
        # Check for all required files
        required_files=(
            "models/distilbert_llm_router/model.safetensors"
            "models/distilbert_llm_router/training_history.json"
            "models/distilbert_llm_router/label_encoder.pkl"
            "models/distilbert_llm_router/vocab.txt"
            "models/distilbert_llm_router/special_tokens_map.json"
            "models/distilbert_llm_router/tokenizer_config.json"
            "models/distilbert_llm_router/config.json"
        )
        
        missing_files=()
        for file in "${required_files[@]}"; do
            if [ -f "$file" ]; then
                echo "✅ $file found: $(ls -lh "$file")"
            else
                echo "❌ $file NOT found!"
                missing_files+=("$file")
            fi
        done
        
        if [ ${#missing_files[@]} -gt 0 ]; then
            echo "❌ Missing required files: ${missing_files[*]}"
            echo "Available in models/distilbert_llm_router/: $(ls -la models/distilbert_llm_router/ 2>/dev/null || echo 'not found')"
            exit 1
        fi
        
        echo "🎉 All DistilBERT model files verified successfully!"
        
        # Create deployment directory structure
        mkdir -p deployment_package/static
        
        # Copy main API file
        cp api/main.py deployment_package/main.py
        
        # Copy supporting files (with error handling)
        cp api/mock_llm_responses.py deployment_package/ 2>/dev/null || echo "⚠️ mock_llm_responses.py not found"
        cp api/real_llm_integration_example.py deployment_package/ 2>/dev/null || echo "⚠️ real_llm_integration_example.py not found"
        cp api/cost_tracker.py deployment_package/ 2>/dev/null || echo "⚠️ cost_tracker.py not found"
        cp src/distilbert_inference.py deployment_package/ 2>/dev/null || echo "⚠️ distilbert_inference.py not found"
        
        # Copy static files
        cp api/static/index.html deployment_package/static/ 2>/dev/null || echo "⚠️ index.html not found"
        cp api/static/nexus-ai-logo.png deployment_package/static/ 2>/dev/null || echo "⚠️ logo not found"

        # Copy DistilBERT model directory (from Git LFS) - PRESERVE PATH STRUCTURE
        cp -r models/ deployment_package/ 2>/dev/null || echo "⚠️ models directory not found"
        
        # Create requirements.txt from API requirements
        cp api/requirements_api.txt deployment_package/requirements.txt
        
        # Show deployment structure for debugging
        echo "�� Deployment package structure:"
        find deployment_package -type f | sort
        echo "📊 Model files:"
        ls -la deployment_package/models/ 2>/dev/null || echo "Models directory not found"
        echo "🤖 Model verification in deployment package:"
        
        # Check for all required files in deployment package
        deployment_required_files=(
            "deployment_package/models/distilbert_llm_router/model.safetensors"
            "deployment_package/models/distilbert_llm_router/training_history.json"
            "deployment_package/models/distilbert_llm_router/label_encoder.pkl"
            "deployment_package/models/distilbert_llm_router/vocab.txt"
            "deployment_package/models/distilbert_llm_router/special_tokens_map.json"
            "deployment_package/models/distilbert_llm_router/tokenizer_config.json"
            "deployment_package/models/distilbert_llm_router/config.json"
        )
        
        deployment_missing_files=()
        for file in "${deployment_required_files[@]}"; do
            if [ -f "$file" ]; then
                echo "✅ $file correctly placed: $(ls -lh "$file")"
            else
                echo "❌ $file NOT found in deployment package!"
                deployment_missing_files+=("$file")
            fi
        done
        
        if [ ${#deployment_missing_files[@]} -gt 0 ]; then
            echo "❌ Missing files in deployment package: ${deployment_missing_files[*]}"
            echo "Available in deployment package: $(find deployment_package/models/ -type f 2>/dev/null || echo 'not found')"
            exit 1
        fi
        
        echo "🎉 All DistilBERT model files correctly placed in deployment package!"

        # Create startup script
        cat > deployment_package/startup.sh << 'EOF'
        #!/bin/bash
        echo "🚀 Starting LLM Gateway via GitHub Actions"
        echo "========================================="
        echo "Python version: $(python3 --version)"
        echo "Working directory: $(pwd)"
        echo "Files present: $(ls -la)"
        
        # Install pip first if not available
        echo "📦 Setting up Python environment..."
        if ! python3 -m pip --version &> /dev/null; then
            echo "Installing pip..."
            curl https://bootstrap.pypa.io/get-pip.py -o get-pip.py
            python3 get-pip.py --user
            export PATH="$HOME/.local/bin:$PATH"
        fi
        
        # Install dependencies
        echo "📦 Installing dependencies..."
        python3 -m pip install --user --upgrade pip
        python3 -m pip install --user -r requirements.txt
        
        # Check if ALL DistilBERT model files are present
        echo "🤖 Checking for ALL DistilBERT model files..."
        
        # Required files for model to work
        startup_required_files=(
            "models/distilbert_llm_router/model.safetensors"
            "models/distilbert_llm_router/training_history.json"
            "models/distilbert_llm_router/label_encoder.pkl"
            "models/distilbert_llm_router/vocab.txt"
            "models/distilbert_llm_router/special_tokens_map.json"
            "models/distilbert_llm_router/tokenizer_config.json"
            "models/distilbert_llm_router/config.json"
        )
        
        startup_missing_files=()
        for file in "${startup_required_files[@]}"; do
            if [ -f "$file" ]; then
                echo "✅ $file found: $(ls -lh "$file")"
            else
                echo "❌ $file NOT found!"
                startup_missing_files+=("$file")
            fi
        done
        
        if [ ${#startup_missing_files[@]} -gt 0 ]; then
            echo "❌ Missing required files for startup: ${startup_missing_files[*]}"
            echo "Available files: $(ls -la)"
            echo "Models directory: $(ls -la models/ 2>/dev/null || echo 'not found')"
            exit 1
        fi
        
        echo "🎉 All DistilBERT model files verified for startup!"
        echo "Model path: $(pwd)/models/distilbert_llm_router"
        
        # Start the application
        echo "🌐 Starting FastAPI application..."
        python3 -m uvicorn main:app --host 0.0.0.0 --port 8000 --log-level info
        EOF
        chmod +x deployment_package/startup.sh
        
        # Show the deployment structure for debugging
        echo "📁 Deployment package structure:"
        find deployment_package -type f | sort
        
        # Create ZIP file
        cd deployment_package
        zip -r ../llm_gateway_deployment.zip . -x "*.pyc" "*.pyo" "__pycache__/*" "*.DS_Store"
        cd ..
        
        echo "📦 Deployment package created: llm_gateway_deployment.zip"
        echo "📊 Final package size: $(ls -lh llm_gateway_deployment.zip)"
        
    - name: Deploy to Azure App Service
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        package: ./llm_gateway_deployment.zip
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        slot-name: production
      env:
        AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}