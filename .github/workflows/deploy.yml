name: Deploy LLM Gateway to Azure App Service

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  # Azure App Service Configuration
  AZURE_WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}
  AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
  ACR_NAME: ${{ secrets.ACR_NAME }}
  IMAGE_NAME: ${{ secrets.IMAGE_NAME }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        lfs: true
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r api/requirements_api.txt
        
    - name: Run tests
      run: |
        python -m pytest tests/ -v || echo "⚠️ Tests failed, but continuing deployment"
        
    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
        
    - name: Verify DistilBERT model files
      run: |
        echo "📊 Verifying DistilBERT model and all required files..."
        
        # Check for all required files
        required_files=(
            "models/distilbert_llm_router/model.safetensors"
            "models/distilbert_llm_router/training_history.json"
            "models/distilbert_llm_router/label_encoder.pkl"
            "models/distilbert_llm_router/vocab.txt"
            "models/distilbert_llm_router/special_tokens_map.json"
            "models/distilbert_llm_router/tokenizer_config.json"
            "models/distilbert_llm_router/config.json"
        )
        
        missing_files=()
        for file in "${required_files[@]}"; do
            if [ -f "$file" ]; then
                echo "✅ $file found: $(ls -lh "$file")"
            else
                echo "❌ $file NOT found!"
                missing_files+=("$file")
            fi
        done
        
        if [ ${#missing_files[@]} -gt 0 ]; then
            echo "❌ Missing required files: ${missing_files[*]}"
            echo "Available in models/distilbert_llm_router/: $(ls -la models/distilbert_llm_router/ 2>/dev/null || echo 'not found')"
            exit 1
        fi
        
        echo "🎉 All DistilBERT model files verified successfully!"
        
    - name: Build and push Docker image to ACR
      run: |
        echo "🔨 Building and pushing Docker image to ACR..."
        
        # Build and push with commit SHA tag
        az acr build --registry ${{ env.ACR_NAME }} --image smart-router:${{ github.sha }} --file Dockerfile .
        
        # Also tag as latest
        az acr build --registry ${{ env.ACR_NAME }} --image ${{ env.IMAGE_NAME }} --file Dockerfile .
        
        echo "✅ Docker image built and pushed successfully!"
        
    - name: Deploy to Azure App Service
      run: |
        echo "🌐 Deploying to Azure App Service..."
        
        # Update App Service to use the new image
        az webapp config container set \
          --name ${{ env.AZURE_WEBAPP_NAME }} \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --docker-custom-image-name ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}
        
        echo "✅ App Service updated with new image!"
        
    - name: Set environment variables
      run: |
        echo "🔐 Setting environment variables..."
        
        # Set required environment variables for the application
        az webapp config appsettings set \
          --name ${{ env.AZURE_WEBAPP_NAME }} \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --settings \
            MODEL_PATH=/app/models/distilbert_llm_router \
            PYTHONPATH=/app \
            WEBSITES_PORT=8000 \
            PORT=8000 \
            O3_ENDPOINT="${{ secrets.O3_ENDPOINT }}" \
            O3_API_KEY="${{ secrets.O3_API_KEY }}" \
            GPT4O_MINI_ENDPOINT="${{ secrets.GPT4O_MINI_ENDPOINT }}" \
            GPT4O_MINI_API_KEY="${{ secrets.GPT4O_MINI_API_KEY }}" \
            O4_MINI_ENDPOINT="${{ secrets.O4_MINI_ENDPOINT }}" \
            O4_MINI_API_KEY="${{ secrets.O4_MINI_API_KEY }}" \
            DEBUG="${{ secrets.DEBUG || 'false' }}"
        
        echo "✅ Environment variables set successfully!"
        
    - name: Configure startup command
      run: |
        echo "⚙️ Configuring startup command..."
        
        az webapp config set \
          --name ${{ env.AZURE_WEBAPP_NAME }} \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --startup-file "python -m uvicorn main:app --host 0.0.0.0 --port 8000 --workers 1"
        
        echo "✅ Startup command configured!"
        
    - name: Health check
      run: |
        echo "🧪 Performing health check..."
        
        # Wait for app to start
        sleep 30
        
        # Get the public URL
        PUBLIC_URL="https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
        
        # Test health endpoint
        if curl -f "$PUBLIC_URL/health"; then
          echo "✅ Health check passed!"
          echo "🌐 App is available at: $PUBLIC_URL"
          echo "📊 Dashboard: $PUBLIC_URL/dashboard"
          echo "📚 API Docs: $PUBLIC_URL/docs"
        else
          echo "⚠️ Health check failed. Checking logs..."
          az webapp log tail --name ${{ env.AZURE_WEBAPP_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --timeout 30
          exit 1
        fi